# ============================================================================
# dsh-glass-ranswork 的 bundle patch —— 把「玻璃主题」挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   本文件是玻璃主题插件的“挂载声明”。DSH 启动时按 bundle 层栈把各插件的
#   patch 叠起来组成配置树；本文件就是本插件这一层的内容。
#
# 【工作原理】
#   - insert：往配置树里添加新的插件行（entry）
#   - id：行标识，patch 覆盖时按它定位（唯一）
#   - name：插件模块名，解析到本包的 index.js（宿主半侧）
#   - 因为 package.json 声明了 dsh.client，DSH 的模块系统同时会把本包
#     扫描为“浏览器插件”，向页面提供 client.js
#
# 【config】
#   宿主半侧只负责一件事：把主题设置持久化到 $DSH_HOME/glass-theme.json。
#   所有可调项都有默认值（透明度 80%），所以这里不需要写任何配置。
# ============================================================================

- insert:
    - id: glass-theme
      name: 'dsh-glass-ranswork'
      config: {}
