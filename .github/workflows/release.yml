# 打 tag 即发布：创建 GitHub Release（附 .tgz 资产）。
#
# 为什么要有这条流水线：手写 "重装一次拉最新 main" 那条路走不通 ——
# pnpm 会把 tarball 的 integrity 钉进 lockfile。只有版本号变了的包
# （新 tag 的 codeload URL / Release 资产）才会被重新解析。
#
# 本包**不发 npm**：registry 上没有 dsh-glass-ranswork，用户侧的
# 「有新版本」提示来自本流水线建的 Release（插件查
# api.github.com 的 releases/latest）。所以这里没有 npm publish 步骤。
#
# 用法：
#   1. package.json 的 version 改成要发的版本；
#   2. git tag v1.0.3 && git push origin v1.0.3；
#   3. Actions 创建同名 Release、上传 tgz。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (pkg.version !== tag) {
              console.error(`tag ${process.env.GITHUB_REF_NAME} != package.json ${pkg.version}`);
              process.exit(1);
            }
          '

      - name: Check version.json matches package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const meta = require("./version.json");
            if (meta.version !== pkg.version) {
              console.error(`version.json ${meta.version} != package.json ${pkg.version}`);
              process.exit(1);
            }
          '

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Pack
        run: npm pack

      # 一次上传两个资产：.tgz 给要装包的人，version.json 给
      # api.github.com 不通时的兜底路径
      # （releases/latest/download/version.json）读取。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-glass-ranswork-*.tgz
            version.json
          generate_release_notes: true
