# 打 tag 即发布：发布到 npm + 创建 GitHub Release（附 .tgz 资产）。
#
# 为什么要有这条流水线：手写 "重装一次拉最新 main" 那条路走不通 ——
# pnpm 会把 tarball 的 integrity 钉进 lockfile。只有版本号变了的包
# （新 tag 的 codeload URL / Release 资产 / npm 版本）才会被重新解析。
#
# v1.1.0 起本包**发布到 npm**，所以有两条下发渠道：
#   1. npm registry —— 插件市场靠它推送更新（主要渠道）；
#   2. GitHub Release —— 不想用 npm 的人装 tgz，插件的自建更新检查也查它。
#
# npm 步骤需要仓库 secret `NPM_TOKEN`：
#   npmjs.com → Access Tokens → Generate → Granular，权限 Read and write，
#   **必须勾 "Bypass two-factor authentication (2FA)"**，否则 CI 里 403。
#   没配 secret 时 npm 步骤会跳过（只发 Release），不会让整条流水线失败。
#
# 用法：
#   1. package.json 的 version 改成要发的版本（version.json 同步改）；
#   2. git tag v1.1.0 && git push origin v1.1.0；
#   3. Actions 发布 npm + 创建同名 Release、上传 tgz。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (pkg.version !== tag) {
              console.error(`tag ${process.env.GITHUB_REF_NAME} != package.json ${pkg.version}`);
              process.exit(1);
            }
          '

      - name: Check version.json matches package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const meta = require("./version.json");
            if (meta.version !== pkg.version) {
              console.error(`version.json ${meta.version} != package.json ${pkg.version}`);
              process.exit(1);
            }
          '

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Pack
        run: npm pack

      # 发布到 npm。没配 secret 就跳过（只发 Release），不让整条失败。
      # registry-url 会写一份 .npmrc，npm publish 自动用 NODE_AUTH_TOKEN。
      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public
          rm -f .npmrc

      # 一次上传两个资产：.tgz 给要装包的人，version.json 给
      # 自建更新检查的静态兜底路径读取。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-glass-ranswork-*.tgz
            version.json
          generate_release_notes: true
